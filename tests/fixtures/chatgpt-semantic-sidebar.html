</head><body>

<div id="history"></div></div></aside><main>Original main content stays unchanged.</main>
<script>
for (const row of document.querySelectorAll('[data-app-action-sidebar-project-row]')) row.addEventListener('click', () => {
  const closed = row.getAttribute('aria-expanded') === 'false';
  row.setAttribute('aria-expanded', String(closed)); row.setAttribute('data-app-action-sidebar-project-collapsed', String(!closed));
  const child = row.nextElementSibling; child.inert = !closed; child.setAttribute('aria-hidden', String(!closed));
});
const scroller = document.querySelector('[data-app-action-sidebar-scroll]'), history = document.querySelector('#history');
function render() {
  const index = Math.max(0, Math.min(9, Math.floor((scroller.scrollTop - history.offsetTop)/160)));
  // Render the intersecting row plus its neighbor. At the bottom the viewport
  // spans rows 8 and 9; rendering only row 8 made the last chat unreachable.
  history.innerHTML = [index, index + 1].filter(i => i <= 9).map(i => `<a class="virtual" style="top:${i*160}px" data-interactive-row-link="true" href="/c/semantic-${i}" aria-label="General ${i}">Unwanted surrounding text</a>`).join('');
}
scroller.addEventListener('scroll', () => setTimeout(render, 60)); render();
</script></body></html>
